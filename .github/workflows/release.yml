name: Release Packaging & Provenance

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform dry run packaging without creating a release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Full Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package publication protection
        run: node ./scripts/publish-guard.mjs || true

  package:
    name: Package Release Distribution
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Extract metadata & provenance
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION} (${COMMIT_SHA}) built at ${BUILD_TIME}"

      - name: Assemble release archive
        run: |
          DIST_DIR="opensearch-web-${{ steps.meta.outputs.version }}"
          mkdir -p "${DIST_DIR}"
          cp -r apps packages dist scripts docs README.md package.json package-lock.json docker-compose.yml Dockerfile LICENSE "${DIST_DIR}/" || true
          tar -czf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensearch-web-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.commit }}
          path: |
            opensearch-web-*.tar.gz
            opensearch-web-*.sha256
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opensearch-web-*.tar.gz
            opensearch-web-*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
